# situated 3D VQA —— 观察者相对方位
# 契约：DESIGN.md §24、§26.2、§43、§45
# 首批任务之一（2026-08-24 用户确认的 "metric_or_situated" 中的 situated 分支）

task_id: 3d_vqa.situated.observer_relative_direction
version: 0.1.0
task_family: 3d_vqa
generation_mode: program_first
supervision_level: deterministic_derived

description: >
  给定无人机当前位姿与某实体的三维位置，提问该实体位于观察者的前/后、左/右。
  真值由 observer_relative_direction 程序计算。

three_d_necessity:
  rationale: >
    "左/右"是观察者相对量而非图像相对量：同一实体在无人机改变朝向后左右互换，
    而图像内容可能几乎不变（例如原地偏航）。因此答案必须由观察者朝向向量与
    实体三维位置计算，不能从图像中物体落在画面左右侧读出 —— 后者恰恰是本任务
    要排除的 2D 捷径。
  conditions:
    - answer_changes_under_camera_pose_counterfactual_while_appearance_similar
    - target_requires_metric_3d_geometry

low_altitude_specificity:
  rationale: >
    观察者是飞行中的无人机，其朝向随飞行持续变化。近垂直下视时"前方"与"下方"
    的区分尤其依赖位姿而非外观 —— 这是俯视视角特有的歧义来源。
    （2026-08-25：原 signals 含 aerial_active_view，属主动感知，已按 SPEC §40.1 移除。）
  signals:
    - uav_pose_altitude_nadir_geometry
    - weak_depth_cue_from_nadir_view

required_scene_capabilities:
  # scale_status: 不作要求 —— target 是**角度**（前后/左右），在均匀缩放下不变。
  # 2026-08-25 移除原来的 `metric` 要求，理由同 grounding spec。
  geometry:
    - observer_position
    - observer_forward
    - entity_centroid
  minimum_candidates: 1

target_anchor:
  kind: object_id_with_centroid_and_observer_pose
  maps_to:
    - stable_entity_id
    - entity_centroid
    - observer_pose_id
  note: 方位是"实体 + 观察者位姿"的二元关系，两端都必须可追溯到点云与相机。

visual_input_policy:
  input_type: multi_view_image
  min_views: 1
  max_views: 2
  selection: observer_view_first
  note: 首个视角必须是提问所绑定的观察者位姿对应的那一帧

metadata_input_fields:
  - observer.pose_id
  - observer.position
  - observer.forward
  - observer.up
  - entities.object_id
  - entities.category
  - entities.geometry.centroid

hidden_target_fields:
  - derived.longitudinal
  - derived.lateral
  - derived.lateral_angle_deg

derivation_program: observer_relative_direction
checker: check_observer_relative_direction_answer
prompt_template: vqa/situated_v1
output_schema: schemas/answers/vqa_situated_direction_answer.schema.json

leakage_rules:
  forbidden_input_fields:
    - entities.relative_direction
    - entities.bearing_deg
    - derived.longitudinal
    - derived.lateral
    - derived.lateral_angle_deg
  note: >
    必须给出 observer.forward 与 observer.up，否则"左右"没有定义；但不得给出
    任何已经算好的方位字段。坐标轴约定必须在提示词中写明（SPEC §26.2）。

eligibility:
  require_all:
    - observer_forward_available: true
    - entity_centroid_available: true
    - parallax_ratio_at_least: 0.05    # **尺度无关**的基线充分性判据 = 基线/景深。
                                       # 2026-08-25 替换原来的 camera_baseline_m_at_least: 2.0 ——
                                       # 米制阈值在 relative 尺度场景里无从判定，且本任务的
                                       # target 本就是尺度无关的（DESIGN §40.5 机制 2）。
                                       # 阈值按实测定，见 FINDINGS「视差比」条。
    # domain_calibrated: 不作要求 —— 那是**米制精度**的充分条件，
    # 与尺度无关的 target 无关。2026-08-25 移除。
  reject_if:
    - geometry_confidence_below: 0.80
    - scale_recovery_degenerate: true      # 轨迹退化（近静止/纯旋转/相机共线）
                                           # 判据是基线、帧数与构型，**不是**对齐残差
                                           # （2 帧时残差恒为 0 而尺度误差可达 460%）
    - reconstruction_scale_unstable: true  # 同帧在不同窗口下米制深度不一致；
                                           # 阈值待 VGGT-Ω 实测后确定
    - lateral_angle_within_deadzone: true    # 死区内左右无稳定真值
    - target_coincides_with_observer: true
    - observer_forward_parallel_to_up: true

quality_requirements:
  minimum_geometry_confidence: 0.80
  maximum_answer_count: 1
  lateral_deadzone_deg: 10.0
  deadzone_rationale: >
    正前方 ±10° 内，左右判定会随位姿的微小误差翻转。UAVScenes 的绝对配准
    残差达 0.44~1.89 m，在 20 m 距离上对应约 1.3~5.4° 的角度不确定度，
    因此 10° 死区留有余量。落在死区的样本判为不合格而非放宽判定。

adapters:
  - qwen_2d_metadata
  - pointcloud_native
  - multimodal_3d

capability_tags:
  - viewpoint_reasoning
  - metric_geometry
