# Expert Card: 薄结构（电力线/缆索/细枝）检测 —— 【尚无可用专家】
# Contract: DESIGN.md §23.2 (expert-registry-manager) / §46.6 提前准备清单
# 调研日期: 2026-08-25

expert_id: thin_structure_detector
display_name: 薄结构检测（电力线 / 缆索 / 细枝）
card_version: 0.1.0
role: thin_obstacle_mask_and_centerline
spec_ref: DESIGN §14.6（薄障碍证据规则，已就绪待启用）
research_tier: A0
deployment_status: not_available          # 不是「没做」，是「查过，生态里没有」

# ---- 为什么现在就建卡（§40.1 的说明框）----
# 用户 2026-08-25 指出：「不在本数据集生成任务」≠「不准备提取能力」。
# 薄结构感知是点云理解模型该有的能力；数据集限制只挡住**生成**，不挡**准备**。
# 许可核验与部署验证会失败且失败隐蔽，等拿到前视数据集才发现不可用，
# 等于把两件本可并行的事白白串行。
serves_backlog:
  - R-30  # 薄障碍检测与中心线
  - R-31  # 前向避障、通道净空

# ---- 调研结论 ----
survey:
  date: '2026-08-25'
  conclusion: >
    **没有可直接使用的预训练专家模型。** HuggingFace 上以 powerline /
    transmission line / cable / wire 检索，命中的全是 0 下载量的个人习作；
    检索 "ttpla" 命中的是同名但无关的 Stable Diffusion ControlNet（TTPlanet）。
    生态里现成的是**数据集**，不是**专家**。
  implication: >
    因此「准备这个专家」不是「下载并测试」，而是「拿公开数据集微调一个检测器」——
    工作量显著更大。这一点必须在排期时说清楚，不能按「下个模型跑一跑」估。
  available_datasets:
    - name: TTPLA
      what: 航拍输电塔与电力线实例分割，1100 张 3840×2160，8987 个实例，COCO 多边形
      paper: https://arxiv.org/abs/2010.10032
      code: https://github.com/r3ab/ttpla_dataset
      hf_mirror: https://huggingface.co/datasets/grantmwilkinson/epri-transmission-ttpla
      hf_gated: false
      license: 'other —— **需人工核验**，HF 标签只写 other，未给具体条款'
      note: 该镜像标 1242 张（原论文 1100），疑为扩展版，用前需比对
  why_hard: >
    薄结构本身就是检测难点：像素占比极小、长细比极大、常与背景低对比。
    §14.6 的证据规则（概率/骨架/边界置信度/多帧支持/3D 拟合残差）正是为此而写，
    规则已就绪，缺的是产出这些证据的模型。

# ---- 准备工作要做完的四项（§46.6）----
preparation_checklist:
  license_verified: false      # TTPLA 镜像是 license:other，条款待核
  weights_obtainable: false    # 无预训练权重，需自行训练
  deployment_verified: false
  io_contract_measured: false

uav_validation_status: not_started
