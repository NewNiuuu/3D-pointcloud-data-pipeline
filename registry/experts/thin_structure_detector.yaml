# ---- 调研结论 ----
# ⚠ 2026-08-25 当日更正：下面这条结论**不成立**
correction:
  date: '2026-08-25'
  what_was_wrong: >
    首版结论写「没有可直接使用的预训练专家模型」。**该结论只搜了 HuggingFace。**
    实际上 PowerLine-MTYOLO 在 **GitHub 仓库里直接放了 checkpoint**
    （`PowerLine-MTYOLO-NANO-150Epochs.pt`，6.0 MB，AGPL-3.0）。
  lesson: >
    **UAV / 遥感这类小众领域的模型大量只发在 GitHub，不上 HuggingFace。**
    只搜 HF 会系统性漏掉它们。专家调研的检索面必须包含 GitHub 与论文主页。
  but_still_true: >
    「有 checkpoint」不等于「能部署」—— 该权重需要**分叉版 ultralytics** 才能加载，
    详见 `powerline_mtyolo_nano.yaml`。所以「准备 = 比下载更重」这个判断依然成立，
    只是原因不同：不是没权重，是运行时不通用。

survey:
  date: '2026-08-25'
  conclusion: >
    HuggingFace 上检索不到可用的薄结构专家（命中项均为 0 下载量个人习作；
    搜 "ttpla" 命中的是同名无关的 Stable Diffusion ControlNet）。
    **但 GitHub 上有** —— 见上方 correction。
  implication: >
    因此「准备这个专家」不是「下载并测试」，而是「拿公开数据集微调一个检测器」——
    工作量显著更大。这一点必须在排期时说清楚，不能按「下个模型跑一跑」估。
  available_datasets:
    - name: TTPLA
      what: 航拍输电塔与电力线实例分割，1100 张 3840×2160，8987 个实例，COCO 多边形
      paper: https://arxiv.org/abs/2010.10032
      code: https://github.com/r3ab/ttpla_dataset
      hf_mirror: https://huggingface.co/datasets/grantmwilkinson/epri-transmission-ttpla
      hf_gated: false
      license: 'HF 镜像标 other；**原仓库 r3ab/ttpla_dataset 是 Apache-2.0**（已核验）'
      has_weights: false    # 实测：仓库只有 scripts/ 与 splitting_dataset_txt/，无 checkpoint
      note: 该镜像标 1242 张（原论文 1100），疑为扩展版，用前需比对
  why_hard: >
    薄结构本身就是检测难点：像素占比极小、长细比极大、常与背景低对比。
    §14.6 的证据规则（概率/骨架/边界置信度/多帧支持/3D 拟合残差）正是为此而写，
    规则已就绪，缺的是产出这些证据的模型。

