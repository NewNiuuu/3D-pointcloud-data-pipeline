expert_id: sam2_1_hiera_base_plus
display_name: SAM 2.1 Hiera Base+
card_version: 0.2.0
role: mask_generation_and_video_tracking
spec_ref: SPEC §14.1 / §34 tracking
research_tier: A0
deployment_status: deployed_verified
sources:
  weights: https://huggingface.co/facebook/sam2.1-hiera-base-plus
license:
  code: Apache-2.0
  weights: apache-2.0
  gated: false
  training_allowed: true
  evaluation_only: false
  verified_at: '2026-08-25'
  verified_via: GitHub API /repos/facebookresearch/sam2/license
io_contract:
  entry: pipeline.grounded_sam.GroundedSAM.masks_from_boxes
  outputs:
    pred_masks: (B,K,3,H',W') → post_process_masks 还原到原图
    iou_scores: (B,K,3)
  selection: 按模型自报的 predicted IoU 在 3 个候选粒度中取最优
  note: >-
    §14.1 强制：mask 置信度与检测置信度分开存。反投影**只用 mask 内像素**，
    绝不整框提升 —— 俯视图里车框内往往大半是路面。
measured:
  deployment_smoke:
    tested_on: UAVScenes AMtown01 单点提示
    mask_shape: (1,3,2048,2448)
    iou_scores: [0.159, 0.714, 0.843]
  chained_with_grounding_dino:
    date: '2026-08-25'
    script: scripts/smoke_grounded_sam.py
    tested_on: UAVScenes 3 场景 × 2 帧
    n_masks: 47
    mask_over_box_area_median: 0.510    # mask 面积/框面积，远小于 1 → 确实在描边界而非填框
    mask_outside_box_ratio_median: 0.011
uav_validation_status: validated
uav_measured_behavior:
  mask_can_exceed_the_prompt_box:
    observed_range: 最多 1.178 倍框面积（"a truck bus" 那一例）
    why_not_a_bug: >-
      SAM 的框提示是**提示不是硬约束**：框只框住部件时，它会补全到整个物体。
      坐标系搞错会给出 ≈0 的重叠，实测中位重叠 0.989，不是那种错。
    how_it_is_used: >-
      mask_outside_box_ratio 被当作**检测器/分割器分歧信号**记录下来
      （§0.7 第三层：单个教师给不出这个数）。
  purity_is_not_boundary_correctness: >-
    与 OneFormer 融合后 category_purity 中位 0.897，但**高纯度只证明 mask 语义一致，
    不证明它是一个正确的物体边界** —— 均质屋顶上的一块 mask 纯度 100%，却不是实例。
    写作时不得把纯度当边界质量指标。
production_ready: true
blocking_issues:
- 视频跟踪（Sam2VideoModel）路径尚未验证，当前只验证了单帧 mask
