blocking_issues:
- 依赖冲突：MoGe 要求 numpy>=2，而 VGGT-Ω 与 DA3 均要求 numpy<2 —— 三者不能共存于同一环境
- 需要 flex-gemm（指定 commit 的 CUDA 扩展，github.com/JeffreyXiang/FlexGEMM）与 utils3d_moge 专用 fork，非 PyPI 版 utils3d
resolution_plan:
- 为 MoGe 建独立 conda 环境（如 nyp-moge），与主环境通过文件交换输出
- 该方案与其角色相容：MoGe 作为关键帧上的离线几何交叉校验，本就不需要与 VGGT-Ω 同进程
- SPEC §14.12 要求的对齐与残差计算在主环境完成，输入为 MoGe 导出的深度/法向文件
