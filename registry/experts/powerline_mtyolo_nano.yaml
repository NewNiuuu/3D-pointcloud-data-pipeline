# ---- 部署核验（这一步救了后面的时间）----
deployment_investigation:
  date: '2026-08-25'
  finding: >
    权重能下载（6.0 MB），但**用官方 ultralytics 加载失败**：
    checkpoint 里 pickle 了 `ultralytics.nn.tasks.MultiModel`，
    该类不存在于上游 ultralytics 8.4.128。
    PowerLine-MTYOLO 建构于 **A-YOLOM**（YOLOv8 多任务分叉），
    因此运行需要作者链路上的**分叉版 ultralytics**，不是 pip 上的官方包。
  repo_contents: >
    仓库根目录**只有 README.md 与那个 .pt**，**不含代码** ——
    README 指向 Google Drive 上的 Colab notebook。
  required_runtime:
    repo: https://github.com/JiayuanWang-JW/YOLOv8-multi-task
    license: AGPL-3.0
    stars: 400
    last_push: '2025-11-17'
  implication: >
    「有 checkpoint」≠「能部署」。接入成本 = 引入一个分叉的 ultralytics
    并与本项目现有 torch 2.8 / numpy 1.26 环境共存，**很可能需要独立 env**
    （与 nyp-moge 同理）。排期须按这个算，不能按「下个权重跑一跑」。

